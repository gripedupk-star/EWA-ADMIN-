name: Build EWA Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build EWA Admin v0.7.1
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # -------------------------------------------------------
      # ANDROID SDK
      # -------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # -------------------------------------------------------
      # VERIFY PROJECT AT REPOSITORY ROOT
      # -------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          echo "===== REPOSITORY ROOT ====="
          pwd

          echo ""
          echo "===== FILES ====="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "===== CHECKING PROJECT ====="

          test -f settings.gradle || {
            echo "ERROR: settings.gradle not found in repository root."
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: build.gradle not found in repository root."
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle not found."
            exit 1
          }

          echo "Android project detected successfully."

      # -------------------------------------------------------
      # FIREBASE
      # -------------------------------------------------------
      - name: Create Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: FIREBASE_GOOGLE_SERVICES_JSON secret is missing."
            echo "Add it at:"
            echo "Settings > Secrets and variables > Actions"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

          test -s app/google-services.json || {
            echo "ERROR: google-services.json was not created."
            exit 1
          }

          echo "Firebase configuration created."

      # -------------------------------------------------------
      # GRADLE
      # -------------------------------------------------------
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Show build environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version

          echo ""
          echo "===== ANDROID ====="
          echo "ANDROID_HOME=$ANDROID_HOME"

      # -------------------------------------------------------
      # BUILD
      # -------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      # -------------------------------------------------------
      # VERIFY
      # -------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching for generated APKs:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      # -------------------------------------------------------
      # PREPARE FINAL APK
      # -------------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/EWA-Admin-v0.7.1.apk

          ls -lh release/EWA-Admin-v0.7.1.apk

      # -------------------------------------------------------
      # UPLOAD
      # -------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EWA-Admin-v0.7.1-APK
          path: release/EWA-Admin-v0.7.1.apk
          if-no-files-found: error
          retention-days: 30
