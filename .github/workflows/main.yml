name: Build EWA Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build EWA Admin v0.7.1
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 ready."

      # =========================================================
      # VERIFY THE ACTUAL PROJECT STRUCTURE
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " EWA ADMIN PROJECT CHECK"
          echo "=========================================="

          test -d android-admin || {
            echo "ERROR: android-admin folder missing."
            exit 1
          }

          test -f android-admin/settings.gradle || {
            echo "ERROR: android-admin/settings.gradle missing."
            exit 1
          }

          test -f android-admin/build.gradle || {
            echo "ERROR: android-admin/build.gradle missing."
            exit 1
          }

          test -f android-admin/gradle.properties || {
            echo "ERROR: android-admin/gradle.properties missing."
            exit 1
          }

          test -f android-admin/app/build.gradle || {
            echo "ERROR: android-admin/app/build.gradle missing."
            exit 1
          }

          echo ""
          echo "Project structure verified successfully."
          echo ""

          echo "settings.gradle:"
          ls -lh android-admin/settings.gradle

          echo "Root build.gradle:"
          ls -lh android-admin/build.gradle

          echo "App build.gradle:"
          ls -lh android-admin/app/build.gradle

      # =========================================================
      # FIREBASE CONFIG
      # =========================================================
      - name: Create Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "=========================================="
            echo "ERROR: Firebase secret is missing."
            echo "=========================================="
            echo ""
            echo "Create this GitHub Repository Secret:"
            echo ""
            echo "FIREBASE_GOOGLE_SERVICES_JSON"
            echo ""
            echo "Settings > Secrets and variables > Actions"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android-admin/app/google-services.json

          test -s android-admin/app/google-services.json || {
            echo "ERROR: google-services.json creation failed."
            exit 1
          }

          echo "google-services.json created successfully."

      # =========================================================
      # BASIC FIREBASE JSON VALIDATION
      # =========================================================
      - name: Validate Firebase configuration
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "android-admin/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          project_info = data.get("project_info", {})

          if not project_info.get("project_id"):
              raise SystemExit(
                  "ERROR: project_id missing from google-services.json"
              )

          clients = data.get("client", [])

          if not clients:
              raise SystemExit(
                  "ERROR: No Android client found in google-services.json"
              )

          packages = []

          for client in clients:
              package = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package:
                  packages.append(package)

          print("Firebase project:", project_info["project_id"])
          print("Firebase Android packages:", packages)

          if "com.ewa.admin" not in packages:
              raise SystemExit(
                  "ERROR: Firebase configuration does not contain "
                  "package com.ewa.admin"
              )

          print("Firebase configuration verified.")
          PY

      # =========================================================
      # GRADLE 8.7
      # =========================================================
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # =========================================================
      # ENVIRONMENT
      # =========================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="
          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="
          echo "$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "ERROR: Android Platform 35 missing."
            exit 1
          }

          test -d "$ANDROID_HOME/build-tools/35.0.0" || {
            echo "ERROR: Android Build Tools 35.0.0 missing."
            exit 1
          }

          echo "Build environment verified."

      # =========================================================
      # GRADLE PROJECT VALIDATION
      # =========================================================
      - name: Validate Gradle project
        working-directory: android-admin
        shell: bash
        run: |
          set -e

          echo "Checking Gradle project..."

          gradle projects \
            --no-daemon \
            --stacktrace

      # =========================================================
      # BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        working-directory: android-admin
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      # =========================================================
      # LOCATE APK
      # =========================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="android-admin/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "=========================================="
            echo "ERROR: Expected APK was not generated."
            echo "=========================================="
            echo ""
            echo "Searching entire repository for APKs:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo " APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""

          ls -lh "$APK"

      # =========================================================
      # PREPARE FINAL APK
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            android-admin/app/build/outputs/apk/debug/app-debug.apk \
            release/EWA-Admin-v0.7.1.apk

          test -f release/EWA-Admin-v0.7.1.apk

          echo ""
          echo "Final APK:"
          ls -lh release/EWA-Admin-v0.7.1.apk

      # =========================================================
      # UPLOAD
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EWA-Admin-v0.7.1-APK
          path: release/EWA-Admin-v0.7.1.apk
          if-no-files-found: error
          retention-days: 30
