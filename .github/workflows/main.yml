name: Build EWA Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build EWA Admin v0.7.1
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # JAVA 17
      # -------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # -------------------------------------------------------
      # USE GITHUB RUNNER'S PREINSTALLED ANDROID SDK
      # -------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo "SDK Manager:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      # -------------------------------------------------------
      # INSTALL ONLY REQUIRED SDK PACKAGES
      # -------------------------------------------------------
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 ready."

      # -------------------------------------------------------
      # VERIFY REPOSITORY
      # -------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Android project files:"

          find android-admin -maxdepth 2 -type f | sort

          test -f android-admin/settings.gradle || {
            echo "ERROR: android-admin/settings.gradle missing"
            exit 1
          }

          test -f android-admin/build.gradle || {
            echo "ERROR: android-admin/build.gradle missing"
            exit 1
          }

          test -f android-admin/app/build.gradle || {
            echo "ERROR: android-admin/app/build.gradle missing"
            exit 1
          }

          echo ""
          echo "Android project OK."

      # -------------------------------------------------------
      # FIREBASE
      # -------------------------------------------------------
      - name: Create Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR:"
            echo "FIREBASE_GOOGLE_SERVICES_JSON secret is missing."
            echo ""
            echo "GitHub:"
            echo "Settings > Secrets and variables > Actions"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android-admin/app/google-services.json

          test -s android-admin/app/google-services.json || {
            echo "ERROR: google-services.json creation failed"
            exit 1
          }

          echo "Firebase configuration ready."

      # -------------------------------------------------------
      # GRADLE 8.7
      # -------------------------------------------------------
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # -------------------------------------------------------
      # ENVIRONMENT CHECK
      # -------------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version

          echo ""
          echo "===== ANDROID ====="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo ""
          echo "===== SDK 35 ====="
          ls -la "$ANDROID_HOME/platforms/android-35"

      # -------------------------------------------------------
      # BUILD
      # -------------------------------------------------------
      - name: Build Debug APK
        working-directory: android-admin
        shell: bash
        run: |
          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      # -------------------------------------------------------
      # FIND APK
      # -------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          APK="android-admin/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: Expected APK not found."
            echo ""
            echo "Available APK files:"

            find . -type f -name "*.apk" -print

            exit 1
          fi

          echo ""
          echo "APK SUCCESSFULLY BUILT"
          echo ""

          ls -lh "$APK"

      # -------------------------------------------------------
      # FINAL APK
      # -------------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release

          cp \
            android-admin/app/build/outputs/apk/debug/app-debug.apk \
            release/EWA-Admin-v0.7.1.apk

          echo ""
          echo "Final APK:"
          ls -lh release/EWA-Admin-v0.7.1.apk

      # -------------------------------------------------------
      # GITHUB ARTIFACT
      # -------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EWA-Admin-v0.7.1-APK
          path: release/EWA-Admin-v0.7.1.apk
          if-no-files-found: error
          retention-days: 30
